[project]
name = "gspaenli"
version = "0.1.0"
description = "Swiss answers, your choice of personality."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp==2.3.0",
    "pydantic>=2.7,<3",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "modal==1.6.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gspaenli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = ["integration: starts the real Swiss MCP over stdio (run scripts/fetch_mcp.sh first)"]
